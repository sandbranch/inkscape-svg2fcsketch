name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # inkex without PyGObject, which only its GUI helpers need
      - run: pip install --no-deps inkex==1.4.0
      - run: pip install "lxml>=4.5,<6" numpy pytest tinycss2 cssselect pyparsing packaging ruff
      - run: ruff format --check
      - run: ruff check
      - run: python -m pytest -q tests/test_units.py
