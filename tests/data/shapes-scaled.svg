<?xml version="1.0" encoding="UTF-8"?>
<!-- The same drawing, user unit 0.5 mm, viewBox offset, layers transformed: must give the same sketches -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="120mm" height="80mm" viewBox="-10 -20 240 160" sodipodi:docname="shapes-scaled.svg">
  <g inkscape:groupmode="layer" inkscape:label="Plate" id="plate" transform="translate(-10 -20) scale(2)">
    <rect id="outline" x="5" y="5" width="110" height="70" rx="6" style="fill:none;stroke:#000;stroke-width:0.02"/>
    <circle id="hole" cx="20" cy="20" r="4" style="fill:none;stroke:#000;stroke-width:0.02"/>
    <g transform="rotate(25 60 40)"><ellipse id="slot" cx="60" cy="40" rx="12" ry="5" style="fill:none;stroke:#000;stroke-width:0.02"/></g>
    <g transform="matrix(1 0 0.4 1 0 0)"><circle id="skewed" cx="70" cy="62" r="5" style="fill:none;stroke:#000;stroke-width:0.02"/></g>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Curves" id="curves" transform="translate(-10 -20) scale(2)">
    <path id="wave" d="M 10,60 C 20,45 30,75 40,60 Q 50,50 55,62 L 55,70 H 10 Z" style="fill:none;stroke:#000;stroke-width:0.02"/>
    <path id="arcs" d="M 80,15 A 8,8 0 0 1 96,15 A 8,8 0 1 0 104,25 L 104,30 A 10,5 30 0 1 90,32 Z" style="fill:none;stroke:#000;stroke-width:0.02"/>
    <g transform="translate(200 0) scale(-1 1)"><path id="mirrored" d="M 95,45 A 6,6 0 0 1 107,45 L 107,55 L 95,55 Z" style="fill:none;stroke:#000;stroke-width:0.02"/></g>
  </g>
</svg>
